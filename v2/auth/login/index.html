    <style>

        .login-box,.register-box{

            width: 500px;

<body class="hold-transition login-page" style="background: url(/img/ppt5380.jpg) no-repeat;background-size: cover;">



<div class="login-box">

  <div class="login-logo" style="font-size: 50px;">

    <a href="../../index.html"><b>MarsFortune USA</b></a>

  </div>

  <!-- /.login-logo -->

  <div class="login-box-body">

    <p class="login-box-msg">Login</p>



    <form action="https://marsag.cfkj88.com/auth/login" method="post">

      <div class="form-group has-feedback 1">



        

        <input type="text" class="form-control" placeholder="Username" name="username" value="">

        <span class="glyphicon glyphicon-envelope form-control-feedback"></span>

      </div>

      <div class="form-group has-feedback 1">



        

        <input type="password" class="form-control" placeholder="Password" name="password">

        <span class="glyphicon glyphicon-lock form-control-feedback"></span>

      </div>

      <div class="row">

        <div class="col-xs-6 remember_me">

                  </div>

        <!-- /.col -->

        <div class="col-xs-6">

          <input type="hidden" name="_token" value="F77ykqmxL8lIdL2XOEEDWzVuRyZvkXYgod7jApUO">

          <button type="submit" class="btn btn-primary btn-block btn-flat">Login</button>

        </div>

        <!-- /.col -->

      </div>



      <div class="form-group">

        <select class="form-control" id="locale">

                      <option value="en" selected>English</option>

                      <option value="es" 1>Español</option>

                      <option value="pt-br" 1>Português brasileiro</option>

                      <option value="zh-TW" 1>繁體中文</option>

                  </select>

      </div>

    </form>



  </div>

  <!-- /.login-box-body -->

</div>

<!-- /.login-box -->



<!-- jQuery 2.1.4 -->

<script src="../../vendor/laravel-admin/AdminLTE/plugins/jQuery/jQuery-2.1.4.min.js"></script>

<!-- iCheck -->

<script src="../../vendor/laravel-admin/AdminLTE/plugins/iCheck/icheck.min.js"></script>

<script>

  $(function () {

    $('input').iCheck({

      checkboxClass: 'icheckbox_square-blue',

      radioClass: 'iradio_square-blue',

      increaseArea: '20%' // optional

    });

    $.ajaxSetup({headers: {'X-CSRF-TOKEN': $('input[name="_token"]').attr('value')}});



    $("#locale").change(function () {

      let locale = $('#locale option:selected').val();

      $.post("https://marsag.cfkj88.com/locale",{locale: locale}, function () {

        location.reload();

      })

    });

  });

</script>
